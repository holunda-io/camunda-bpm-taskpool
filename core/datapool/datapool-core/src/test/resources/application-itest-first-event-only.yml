spring:
  application:
    name: taskpool-core-itest
  datasource:
    url: jdbc:h2:mem:itest;
    username: sa
    password:
  jpa:
    generate-ddl: false
    hibernate.ddl-auto: validate
    show-sql: false
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/polyflow/polyflow-core-changelog.xml

polyflow:
  core:
    data-entry:
      event-sourcing-repository-type: io.holunda.polyflow.datapool.core.repository.FirstEventOnlyEventSourcingRepository

logging.level:
  io.holunda.polyflow:
    datapool:
      core:
        business:
          DataEntryAggregate: DEBUG
          CreateOrUpdateCommandHandler: TRACE
